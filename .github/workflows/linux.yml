name: linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    name: secret-scan preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No credential patterns in tree
        run: |
          if git grep -nE "github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+" -- . ; then
            echo "SECRET-LIKE PATTERN FOUND — failing preflight"
            exit 1
          else
            echo "clean: no github_pat_ / ghp_ patterns"
          fi

  build-test:
    name: gcc — build + full test suite
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build omnicc
        run: make

      - name: Version consistency gate
        run: python3 tests/check_version.py

      - name: Unit tests (t01–t21)
        run: python3 tests/run_tests.py

      - name: Stress tests (stress01–stress09)
        run: python3 tests/run_tests.py --stress

      - name: Regression suite (historical bug classes)
        run: python3 tests/run_regression.py

      - name: "Smoke: standalone build"
        run: |
          printf 'print("ci standalone")\nprint(21 * 2)\n' > /tmp/ci_smoke.ok
          ./bin/omnicc build /tmp/ci_smoke.ok
          /tmp/ci_smoke.exe

  sanitizers:
    name: asan+ubsan — build + test suite
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan + UBSan
        run: make asan

      - name: Unit tests under sanitizers
        run: |
          export ASAN_OPTIONS=detect_leaks=0
          python3 tests/run_tests.py

      - name: Regression suite under sanitizers
        run: |
          export ASAN_OPTIONS=detect_leaks=0
          python3 tests/run_regression.py

      - name: Stress tests under sanitizers
        run: |
          export ASAN_OPTIONS=detect_leaks=0
          python3 tests/run_tests.py --stress

  portable:
    name: no-AVX2 scalar build
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build portable (scalar kernels)
        run: make portable

      - name: Unit tests (scalar paths)
        run: python3 tests/run_tests.py

      - name: Regression suite (scalar paths)
        run: python3 tests/run_regression.py

      - name: Stress tests (scalar paths)
        run: python3 tests/run_tests.py --stress

  linux-arm64:
    name: aarch64 — diagnostics tier (honest skips)
    needs: preflight
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build omnicc (scalar kernel tier auto-selected on aarch64)
        run: make

      - name: Version consistency gate
        run: python3 tests/check_version.py

      - name: Tiered suites (codegen tests SKIP with reason on aarch64)
        run: |
          python3 tests/run_tests.py
          python3 tests/run_tests.py --stress
          python3 tests/run_regression.py

      - name: "Diagnostics smoke: check --json works on this host"
        run: |
          printf 'set x = 41\nprint(x + 1)\n' > /tmp/smoke.ok
          ./bin/omnicc check --json /tmp/smoke.ok

      - name: "Honest refusal: run must fail OMNI-E0005 (exit 2), never SIGILL"
        run: |
          set +e
          out=$(./bin/omnicc run /tmp/smoke.ok 2>&1); code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 2 ] && echo "$out" | grep -q "OMNI-E0005"; then
            echo "OK: clean structured refusal (exit 2, OMNI-E0005)"
          else
            echo "FAIL: expected exit 2 + OMNI-E0005, got exit $code"
            exit 1
          fi
