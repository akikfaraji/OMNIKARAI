name: windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mingw:
    name: MinGW-w64 gcc — build + test suite
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            make
            python

      - name: Build omnicc.exe (Win64 ABI)
        run: |
          make windows CFLAGS="-Iinclude -O2 -g -std=c99 -Wall -Wextra -fno-strict-aliasing -mstackrealign"

      - name: Version consistency gate
        run: python tests/check_version.py

      # DIAGNOSTIC (runs even when the gate failed): first-ever Win64 JIT
      # execution exposed a probe SIGSEGV — collect the full unit-suite
      # picture in the same round to scope the bug. The job stays red via
      # the failed gate step; this step only enriches the log.
      - name: "Diagnostic — unit suite (Win64 JIT health picture)"
        if: always()
        run: python tests/run_tests.py --verbose || true

      - name: Unit tests (Win64 ABI)
        run: python tests/run_tests.py

      - name: Regression suite (Win64 ABI)
        run: python tests/run_regression.py

      - name: Stress tests (Win64 ABI)
        run: python tests/run_tests.py --stress
